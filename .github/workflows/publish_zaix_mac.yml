name: Build Unsigned macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - zaimanhua

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: flutter pub get

      - name: Install macOS Pods
        run: |
          if [ -d macos ]; then
            cd macos
            if [ -f Podfile ]; then
              python3 - <<'PY'
import io, os
path = 'Podfile'
with io.open(path, 'r', encoding='utf-8') as f:
    content = f.read()
if 'platform :osx' not in content:
    content = "platform :osx, '11.0'\n" + content
    with io.open(path, 'w', encoding='utf-8') as f:
        f.write(content)
PY
              pod install --repo-update || pod install
            else
              echo "No macos/Podfile found"
              exit 1
            fi
            cd ..
          else
            echo "No macos directory found"
            exit 1
          fi

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build MacOS Packages
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: build/dist/*/*

      - name: Release macOS Packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/dist/*/*.dmg
            build/dist/*/*.zip
