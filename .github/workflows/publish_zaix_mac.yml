name: Build Unsigned macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          cache: true

      - name: Enable Flutter Desktop for macOS
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd macos
          if ! grep -q "platform :osx" Podfile; then
            sed -i '' "1s/^/platform :osx, '11.0'\n/" Podfile
          fi
          pod install --repo-update || pod install
          cd ..

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build MacOS Packages
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: build/dist/*/*

      - name: Release macOS Packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.TOKEN }}
          files: |
            build/dist/*/*.dmg
            build/dist/*/*.zip

      - run: echo "🍏 macOS build job completed with status: ${{ job.status }}."
