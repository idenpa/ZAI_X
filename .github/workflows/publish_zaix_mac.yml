# ------------------ macOS 编译任务 ------------------
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # 💡 明确锁定为 3.27.x，避开 stable 最尖端通道的 AOT 崩溃 Bug，同时满足依赖需求
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          cache: true

      - name: Enable Flutter Desktop for macOS
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: flutter pub get

      # 💡 预防 CocoaPods 平台版本问题
      - name: Install CocoaPods Dependencies
        run: |
          if [ -d "macos" ] && [ -f "macos/Podfile" ]; then
            cd macos
            python3 -c "
            with open('Podfile', 'r') as f:
                content = f.read()
            if 'platform :osx' not in content:
                new_content = \"platform :osx, '11.0'\n\" + content
                with open('Podfile', 'w') as f:
                    f.write(new_content)
            "
            pod install --repo-update || pod install
            cd ..
          fi

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build MacOS Packages
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: build/dist/*/*

      - name: Release macOS Packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.TOKEN }}
          files: |
            build/dist/*/*.dmg
            build/dist/*/*.zip
