name: Build Unsigned macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "zaix/*"

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # 💡 这次我们用 3.27.x，兼顾新依赖和兼容性
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      # 💡 强力全家桶清洗：把所有要求极高的现代插件版本要求统一“向下兼容”
      - name: Restore Packages & Downgrade Demanding Packages
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # 1. 调整 lints
          content = content.replace('flutter_lints: ^6.0.0', 'flutter_lints: ^3.0.0')
          # 2. 调整图片组件
          content = content.replace('extended_image: ^10.0.1', 'extended_image: ^8.2.0')
          # 3. 调整 html 组件，避免要求 Flutter >=3.32.0
          content = content.replace('flutter_widget_from_html_core: ^0.17.2', 'flutter_widget_from_html_core: ^0.15.0')
          
          # 4. 过滤死锁行
          lines = content.splitlines()
          new_lines = []
          for line in lines:
              if not any(k in line for k in ['path: 1.9.1', 'collection: 1.19.1']):
                  new_lines.append(line)
                  
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(new_lines) + '\n')
          "
          flutter pub get

      - name: Install macOS Pods
        run: |
          cd macos
          python3 - << 'PY'
          import io
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'platform :osx' not in content:
              content = "platform :osx, '11.0'\n" + content
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build MacOS Packages
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: build/dist/*/*

      - name: Release macOS Packages
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v1
        with:
          token: "${{ secrets.TOKEN }}"
          files: |
            build/dist/*/*.dmg
            build/dist/*/*.zip
