name: Build Unsigned macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "zaix/mac/*" # 或者是你习惯触发的 tag 规则

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Flutter Desktop for macOS
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: flutter pub get

      # 💡 仿照 iOS 的处理，如果 macOS 的 Podfile 需要指定最低系统版本（例如 macOS 11.0），可以在这里自动注入
      - name: Install CocoaPods Dependencies
        run: |
          if [ -d "macos" ] && [ -f "macos/Podfile" ]; then
            cd macos
            python3 -c "
            with open('Podfile', 'r') as f:
                content = f.read()
            if 'platform :osx' not in content:
                new_content = \"platform :osx, '11.0'\n\" + content
                with open('Podfile', 'w') as f:
                    f.write(new_content)
            "
            pod install --repo-update || pod install
            cd ..
          fi

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # 📦 使用 flutter_distributor 打包 macOS 的 dmg 和 zip 格式
      - name: Build MacOS Packages
        run: flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 🚀 上传编译好的 macOS DMG 和 ZIP 到 Release（如果不需要自动发布 Release，也可以换成 actions/upload-artifact@v4）
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          body_path: document/RELEASE.txt
          token: ${{ secrets.TOKEN }}
          files: |
            build/dist/*/*.dmg
            build/dist/*/*.zip

      - run: echo "🍏 macOS build job's status is ${{ job.status }}."
