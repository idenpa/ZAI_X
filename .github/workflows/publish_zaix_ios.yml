name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Packages
        run: flutter pub get

      # 💡 强行在 Podfile 顶部注入 platform :ios, '13.0'
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          python3 -c "
          with open('Podfile', 'r') as f:
              content = f.read()
          # 如果里面已经写了 platform，直接重写；没有就插在最前面
          new_content = 'platform :ios, \'13.0\'\n' + content
          with open('Podfile', 'w') as f:
              f.write(new_content)
          "
          pod install --repo-update || pod install

      - name: Build IOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign.ipa
          path: build/ios/iphoneos/ios_no_sign.ipa
