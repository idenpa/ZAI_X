name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          cache: true

      # 💡 动态注入：覆盖 path/collection 冲突，并将 flutter_lints 降级到 Dart 3.5.x 兼容版本
      - name: Inject Dependency Override
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          # 1. 注入 path 与 collection 重写
          override_text = 'dependency_overrides:\n  path: 1.9.0\n  collection: 1.18.0'
          content = content.replace('dependency_overrides:', override_text)
          # 2. 替换高版本 flutter_lints 为适配当前 SDK 的 4.0.0
          content = content.replace('flutter_lints: ^6.0.0', 'flutter_lints: ^4.0.0')
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: Restore Packages
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build IOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign.ipa
          path: build/ios/iphoneos/ios_no_sign.ipa
