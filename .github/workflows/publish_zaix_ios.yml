name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          cache: true

      # 💡 使用标准的 Python 多行读取替换，完全不占用双引号，绝不会触发 YAML 语法错误
      - name: Inject Dependency Override
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          content = content.replace('dependency_overrides:', 'dependency_overrides:\n  path: 1.9.0')
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: Restore Packages
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build IOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign.ipa
          path: build/ios/iphoneos/ios_no_sign.ipa
