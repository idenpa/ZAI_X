name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Packages
        run: flutter pub get

      # 💡 核心修改：在安装 Pod 依赖前，将 Podfile 中的 platform 指定为 iOS 13.0
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          # 动态修正 Podfile 中的 iOS 最低部署版本为 13.0
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" Podfile || true
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '13.0'/" Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" Podfile || true
          pod install --repo-update || pod install

      - name: Build IOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign.ipa
          path: build/ios/iphoneos/ios_no_sign.ipa
