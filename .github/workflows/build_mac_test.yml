name: Build Unsigned macOS App Test

on:
  workflow_dispatch:
  push:
    tags:
      - "zaix/*"

jobs:
  build-macos:
    # 锁定 macOS Runner，避免最新镜像带来的不确定性
    runs-on: macos-14 
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # 🎯 首选版本：3.29.3，满足 SDK 约束且被报告修复了此问题
      # 如果失败，请依次尝试 3.35.0、3.38.0、3.44.4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10" # 锁定到 3.38 系列的最新补丁
          cache: true

      # 显式禁用 SwiftPM，强制使用 CocoaPods，避免迁移警告和冲突
      - name: Disable SwiftPM
        run: flutter config --no-enable-swift-package-manager

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Restore Packages
        run: flutter pub get

      - name: Install macOS Pods
        run: |
          cd macos
          python3 - << 'PY'
          import io
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if 'platform :osx' not in content:
              content = "platform :osx, '11.0'\n" + content
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      # 核心构建命令，附带诊断参数
      - name: Build macOS App
        run: flutter build macos --release --no-tree-shake-icons

      # 用 ditto 打包 .app 生成 zip
      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(ls -d *.app | head -n1)
          APP_NAME=$(basename "$APP_PATH" .app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}_macos_no_sign.zip"

      # 上传 Zip 包
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_dist
          path: build/macos/Build/Products/Release/*_macos_no_sign.zip

      # 如果构建成功，再尝试用 flutter_distributor 打包 dmg
      # - name: Install flutter_distributor
      #   run: dart pub global activate flutter_distributor
      # - name: Build DMG
      #   run: flutter_distributor package --platform macos --targets dmg --skip-clean
