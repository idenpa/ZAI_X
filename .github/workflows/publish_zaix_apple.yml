name: Build iOS & macOS App

on:
  workflow_dispatch: # 允许手动触发测试
  push:
    tags:
      - "zaix/*"       # 只有推送类似 zaix/v1.0.0 的 Tag 时，才会触发并自动发 Release

jobs:
  # ==========================================
  # Job 1: 构建无签名 iOS IPA
  # ==========================================
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i '' 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock 
          flutter pub get

      - name: Sync Xcode Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install iOS Pods
        run: |
          cd ios
          python3 - << 'PY'
          import io
          import re

          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          if "platform :ios" not in content:
              content = "platform :ios, '13.0'\n" + content
          else:
              content = re.sub(r"platform :ios,.*", "platform :ios, '13.0'", content)

          if "post_install" not in content:
              content += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          end
          """

          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/iphoneos/ios_no_sign.ipa

  # ==========================================
  # Job 2: 构建 macOS DMG & ZIP
  # ==========================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Flutter Configurations
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i '' 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Sync Xcode Deployment Target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Install macOS Pods
        run: |
          cd macos
          python3 - << 'PY'
          import io
          import re
          
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
              
          if "platform :osx" not in content:
              content = "platform :osx, '10.15'\n" + content
          else:
              content = re.sub(r"platform :osx,.*", "platform :osx, '10.15'", content)
              
          if "post_install" not in content:
              content += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = '10.15'
              end
            end
          end
          """
          
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Build macOS App
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS Artifacts
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(ls -d *.app | head -n1)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          hdiutil create -volname "$APP_NAME" -srcfolder dmg_temp -ov -format UDZO "${APP_NAME}_macos_installer.dmg"
          rm -rf dmg_temp
          
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}_macos_portable.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: |
            build/macos/Build/Products/Release/*_macos_installer.dmg
            build/macos/Build/Products/Release/*_macos_portable.zip

  # ==========================================
  # Job 3: 自动发布到 Release
  # ==========================================
  release:
    needs: [build-ios, build-macos] # 等待前两个 Job 都成功完成
    if: startsWith(github.ref, 'refs/tags/') # 仅在推送 Tag 时触发发布
    runs-on: ubuntu-latest
    permissions:
      contents: write # 使用 GITHUB_TOKEN 需要此权限
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 将所有 artifact 的文件合并到同一个目录

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/*.ipa
            artifacts/*.dmg
            artifacts/*.zip
