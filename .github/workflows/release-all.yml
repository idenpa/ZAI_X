name: Build All Platforms Release

on:
  workflow_dispatch: # 允许手动测试
  push:
    tags:
      - "zaix/*"       # 只有打 zaix/ 开头的 Tag 才触发发版

jobs:
  # 1. 构建 iOS
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i '' 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock 
          flutter pub get

      - name: Sync Xcode Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install iOS Pods
        run: |
          cd ios
          python3 - << 'PY'
          import io
          import re
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if "platform :ios" not in content:
              content = "platform :ios, '13.0'\n" + content
          else:
              content = re.sub(r"platform :ios,.*", "platform :ios, '13.0'", content)
          if "post_install" not in content:
              content += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          end
          """
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create and Rename IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ZAI-X_iOS_Unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/iphoneos/ZAI-X_iOS_Unsigned.ipa

  # 2. 构建 macOS
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Flutter Configurations
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i '' 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Sync Xcode Deployment Target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Install macOS Pods
        run: |
          cd macos
          python3 - << 'PY'
          import io
          import re
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if "platform :osx" not in content:
              content = "platform :osx, '10.15'\n" + content
          else:
              content = re.sub(r"platform :osx,.*", "platform :osx, '10.15'", content)
          if "post_install" not in content:
              content += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = '10.15'
              end
            end
          end
          """
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Build macOS App
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS Artifacts
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(ls -d *.app | head -n1)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          hdiutil create -volname "$APP_NAME" -srcfolder dmg_temp -ov -format UDZO "${APP_NAME}_macos_installer.dmg"
          rm -rf dmg_temp

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: build/macos/Build/Products/Release/*_macos_installer.dmg

  # 3. 构建 Windows
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          (Get-Content pubspec.yaml) -replace 'connectivity_plus: \^[0-9.]*', 'connectivity_plus: 7.0.0' | Set-Content pubspec.yaml
          Remove-Item pubspec.lock -ErrorAction SilentlyContinue
          flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Package Windows Artifact
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\ZAI-X_Windows_Portable.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: build/windows/ZAI-X_Windows_Portable.zip

  # 4. 构建 Android
  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|app-(.*)-release\.apk|\1|')
            mv "$file" "ZAI-X_android_${abi}.apk"
          done

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: build/app/outputs/flutter-apk/*.apk

  # 5. 发布 Release
  release:
    needs: [build-ios, build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/*.ipa
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.apk
