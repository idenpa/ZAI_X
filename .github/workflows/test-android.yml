name: Build Android App (Test)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      # ✅ 采纳官方建议：使用最新版的 setup-gradle，提供极致的缓存加速
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Configure Gradle Mirrors & IPv4
        run: |
          # 1. ✅ 核心必杀：强制 JVM 使用 IPv4（防止 GitHub 容器内 IPv6 导致连接被拒）
          echo "systemProp.java.net.preferIPv4Stack=true" >> android/gradle.properties
          
          # 2. ✅ 核心必杀：使用官方最稳的 CDN，下载体积更小的 bin 包
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://downloads.gradle.org/distributions/gradle-8.14-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. 修改依赖仓库为阿里云镜像，加速第三方依赖下载
          sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' android/build.gradle
          sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' android/build.gradle
          
          if [ -f android/settings.gradle ]; then
            sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' android/settings.gradle
            sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' android/settings.gradle
          fi
          
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|google()|maven { url = uri("https://maven.aliyun.com/repository/google") }\n        google()|g' android/settings.gradle.kts
            sed -i 's|mavenCentral()|maven { url = uri("https://maven.aliyun.com/repository/public") }\n        mavenCentral()|g' android/settings.gradle.kts
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: build/app/outputs/flutter-apk/app-release.apk
