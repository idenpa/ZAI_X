name: Build Android App

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      # ✅ 唯一且最关键的改动：把超大的 all 包换成精简的 bin 包
      - name: Switch Gradle to Bin Package
        run: |
          sed -i 's|-all.zip|-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          echo "--- 确认替换后的地址 ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      # 纯原生构建，让 GitHub 自己走海外网络下载
      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: build/app/outputs/flutter-apk/app-release.apk
