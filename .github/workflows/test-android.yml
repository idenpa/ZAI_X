name: Build Android App (Test)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # ✅ 唯一保留的底层防御：防止 IPv6 问题导致连不上
    env:
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # ✅ 完美复刻 PiliNara：使用 setup-java 的原生缓存
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      # ✅ 删除了所有修改 distributionUrl 和 Maven 镜像的 sed 命令，保持原汁原味
      
      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: build/app/outputs/flutter-apk/app-release.apk
