name: Build Android App (Debug)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      # ✅ 核心修改：构建 Debug 版本，使用 Android 通用测试签名
      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-artifact
          # Debug 包的路径是 app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
