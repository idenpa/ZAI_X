name: Build Android App (Test)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # ✅ 核心防御：强制 IPv4（解决海外节点连 Gradle 官方源的玄学问题）
    env:
      GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # ✅ 新增：将 Base64 还原为 jks 文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          
      # ✅ 新增：生成原作者约定的 zai_key.properties
      - name: Create Key Properties
        run: |
          echo "storeFile=my-release-key.jks" > android/zai_key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/zai_key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/zai_key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/zai_key.properties
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      # ✅ 没有任何修改镜像的 sed 代码，直接构建
      - name: Build APK (Release)
        # ✅ 核心修改：加上 --split-per-abi
        run: flutter build apk --release --split-per-abi

      # ✅ 新增：给生成的包重命名，显得更专业
      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            # 提取架构名称，比如 arm64-v8a
            abi=$(echo "$file" | sed -E 's|app-(.*)-release\.apk|\1|')
            # 重命名文件
            mv "$file" "ZAI-X_android_${abi}.apk"
          done

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          # ✅ 因为重命名过了，这里直接匹配当前目录下所有 apk
          path: build/app/outputs/flutter-apk/*.apk
