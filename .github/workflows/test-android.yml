name: Build Android App (Test)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      # ✅ 采纳建议：升级到最新的 v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Configure Gradle Mirrors
        run: |
          # 1. ✅ 终极修复：使用最暴力的整行替换法，换成华为云镜像
          # 华为云在海外 GitHub 节点的下载速度极其稳定
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://mirrors.huaweicloud.com/gradle/gradle-8.14-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 打印出来看看，日志里确认一下是不是真的替换成了华为云！
          echo "--- 检查 distributionUrl 是否替换成功 ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "---------------------------------------"

          # 2. 修改 build.gradle，加入阿里云仓库（防第三方依赖下载失败）
          sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' android/build.gradle
          sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' android/build.gradle
          
          # 3. 修改 settings.gradle (针对新版 Flutter)
          if [ -f android/settings.gradle ]; then
            sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' android/settings.gradle
            sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' android/settings.gradle
          fi
          
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|google()|maven { url = uri("https://maven.aliyun.com/repository/google") }\n        google()|g' android/settings.gradle.kts
            sed -i 's|mavenCentral()|maven { url = uri("https://maven.aliyun.com/repository/public") }\n        mavenCentral()|g' android/settings.gradle.kts
          fi

      # ✅ 核心修复：去掉 --no-daemon，回归纯净构建命令
      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: build/app/outputs/flutter-apk/app-release.apk
