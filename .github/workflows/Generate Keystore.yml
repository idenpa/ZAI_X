name: Generate Keystore
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          # 生成有效期 10000 天的 keystore
          # 密码设为 123456，别名设为 key
          keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=ZAIX, OU=Dev, O=Dev, L=Dev, ST=Dev, C=CN"
          
      - name: Convert to Base64
        run: |
          # 转换成 Base64 方便复制
          base64 my-release-key.jks > keystore_base64.txt
          cat keystore_base64.txt
