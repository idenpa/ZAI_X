name: Build macOS App (Test)

on:
  workflow_dispatch:
  push:
    tags:
      - "zaix/*"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: zaimanhua

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true

      - name: Flutter Configurations
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Restore Packages (Downgrade connectivity_plus)
        run: |
          sed -i '' 's/connectivity_plus: \^[0-9.]*/connectivity_plus: 7.0.0/' pubspec.yaml
          rm -f pubspec.lock
          flutter pub get

      - name: Sync Xcode Deployment Target
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Install macOS Pods
        run: |
          cd macos
          python3 - << 'PY'
          import io
          import re
          path = 'Podfile'
          with io.open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          if "platform :osx" not in content:
              content = "platform :osx, '10.15'\n" + content
          else:
              content = re.sub(r"platform :osx,.*", "platform :osx, '10.15'", content)
          if "post_install" not in content:
              content += """
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = '10.15'
              end
            end
          end
          """
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PY
          pod install --repo-update || pod install
          cd ..

      - name: Build macOS App
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS Artifacts
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(ls -d *.app | head -n1)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          
          hdiutil create -volname "$APP_NAME" -srcfolder dmg_temp -ov -format UDZO "${APP_NAME}_macos_installer.dmg"
          rm -rf dmg_temp
          
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}_macos_portable.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: |
            build/macos/Build/Products/Release/*_macos_installer.dmg
            build/macos/Build/Products/Release/*_macos_portable.zip
